; php-fpm pool of the panel (docs/adr/0055), written by install.sh on every run.
[proxmotion]
user = proxmotion
group = proxmotion
listen = /run/php/proxmotion.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
; App packages and recipe archives are uploaded on the admin pages (nginx allows 64 MB).
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
