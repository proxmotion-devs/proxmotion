# The panel's locations, included by the site (docs/adr/0055). Written by install.sh from
# deploy/installer/nginx/panel.conf on every run: change the template, not this file.
root @PREFIX@/current/panel/public;
index index.php;
server_tokens off;

client_max_body_size 64m;

# Built assets carry their hash in the name.
location /build/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Browser console WebSocket (the console proxy, docs/adr/0002).
location = /console-ws {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    access_log off;  # the query string holds a (single-use) ticket
}

# Reverb, the WebSocket server of live server statistics (docs/adr/0036): /app/<key>.
location /app/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3700s;
}

# The panel's only PHP file; $realpath_root follows the current release.
location = /index.php {
    fastcgi_pass unix:/run/php/proxmotion.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    include fastcgi_params;
    fastcgi_read_timeout 300s;
    # The Link headers of preloaded assets outgrow the default 4 KB.
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;
}

location ~ \.php$ {
    return 404;
}

location ~ /\.(?!well-known).* {
    deny all;
}
