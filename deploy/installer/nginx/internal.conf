# The console proxy's way to the panel (docs/adr/0002, 0055), on the loopback address only:
# its POST requests must not meet the HTTPS redirect. Written by install.sh on every run.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root @PREFIX@/current/panel/public;
    server_tokens off;

    location /internal/ {
        fastcgi_pass unix:/run/php/proxmotion.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
    }

    location / {
        return 404;
    }
}
