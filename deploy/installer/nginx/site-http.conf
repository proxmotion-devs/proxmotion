# Proxmotion over HTTP (docs/adr/0055), written by install.sh on every run.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @SERVER_NAME@;

    # Let's Encrypt's HTTP challenge (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include snippets/proxmotion-panel.conf;
}
