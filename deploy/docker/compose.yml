# Local development environment.
# Usage (from the repository root):
#   docker compose -f deploy/docker/compose.yml up -d
#   docker compose -f deploy/docker/compose.yml exec app composer install
#   docker compose -f deploy/docker/compose.yml exec app php artisan migrate --seed
name: proxmotion

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ../../panel:/var/www/panel
  environment:
    DB_CONNECTION: mariadb
    DB_HOST: mariadb
    DB_PORT: 3306
    DB_DATABASE: proxmotion
    DB_USERNAME: proxmotion
    DB_PASSWORD: proxmotion
    REDIS_HOST: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    CONSOLE_PROXY_SECRET: ${CONSOLE_PROXY_SECRET:-local-dev-console-secret}
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app

  horizon:
    <<: *app
    command: php artisan horizon

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"

  vite:
    <<: *app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"

  # Relays browser console WebSockets to Proxmox (docs/adr/0002).
  console-proxy:
    build:
      context: ../console-proxy
    environment:
      PANEL_URL: http://nginx
      CONSOLE_PROXY_SECRET: ${CONSOLE_PROXY_SECRET:-local-dev-console-secret}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../../panel:/var/www/panel:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - console-proxy

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: proxmotion
      MARIADB_USER: proxmotion
      MARIADB_PASSWORD: proxmotion
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mariadb-data:
