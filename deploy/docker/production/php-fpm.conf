; php-fpm pool of the panel image (docs/adr/0054), after the image's own zz-docker.conf.
[www]
; The container's environment reaches the panel (its configuration is cached at start anyway).
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
