; PHP settings of the panel image (docs/adr/0054), on top of php.ini-production.
expose_php = Off
memory_limit = 256M
; App packages and recipe archives are uploaded on the admin pages (nginx allows 64 MB).
upload_max_filesize = 64M
post_max_size = 64M

; The code in the image never changes, so files are not checked again.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
