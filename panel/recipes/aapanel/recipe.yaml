format: 2
slug: aapanel
name: aaPanel
version: 1.0.0
category: control-panel
description:
    en: The free aaPanel hosting control panel; web servers, PHP, databases and FTP are installed from its own interface after the first login. Needs a freshly installed server.
    tr: Ücretsiz aaPanel hosting kontrol paneli; web sunucuları, PHP, veritabanları ve FTP ilk girişten sonra kendi arayüzünden kurulur. Yeni kurulmuş bir sunucu gerektirir.
maintainers: [{ name: Proxmotion }]
homepage: https://www.aapanel.com/
requires:
    platform: linux
    os: [debian, ubuntu, almalinux, rocky]
    min_versions: { debian: '12', ubuntu: '22.04', almalinux: '8', rocky: '8' }
    max_versions: { debian: '12', ubuntu: '24.04', almalinux: '9', rocky: '9' }
resources: { min_memory_mib: 1024, min_disk_mib: 20480, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
outputs:
    - key: panel_url
      type: url
      label: { en: Panel address, tr: Panel adresi }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
    - { port: 21, proto: tcp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 30 }
