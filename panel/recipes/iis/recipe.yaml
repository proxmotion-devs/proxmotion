format: 2
slug: iis
name: IIS
version: 1.0.0
category: web
description:
    en: Internet Information Services with ASP.NET 4.x and the IIS Manager, optionally the ASP.NET Core Hosting Bundle.
    tr: ASP.NET 4.x ve IIS Yöneticisi ile Internet Information Services; isteğe bağlı olarak ASP.NET Core Hosting Bundle.
maintainers: [{ name: Proxmotion }]
homepage: https://www.iis.net/
requires:
    platform: windows
resources: { min_memory_mib: 2048, min_disk_mib: 32768, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: aspnet_core
      type: enum
      options: [none, '8.0', '10.0']
      default: none
      label:
          { en: ASP.NET Core Hosting Bundle, tr: ASP.NET Core Hosting Bundle }
outputs:
    - key: site_url
      type: url
      label: { en: Default site, tr: Varsayılan site }
    - key: web_root
      type: text
      label: { en: Site folder, tr: Site klasörü }
firewall:
    - { port: '80', proto: tcp }
    - { port: '443', proto: tcp }
lifecycle:
    install: { script: install.ps1, timeout_minutes: 45 }
    uninstall: { script: uninstall.ps1, timeout_minutes: 30 }
