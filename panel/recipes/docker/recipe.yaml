format: 2
slug: docker
name: Docker
version: 1.3.0
category: container
description:
    en: Docker Engine with the Compose and Buildx plugins from Docker's official package repository.
    tr: Docker'ın resmi paket deposundan Compose ve Buildx eklentileriyle Docker Engine.
maintainers: [{ name: Proxmotion }]
requires:
    platform: linux
    os: [debian]
    min_versions: { ubuntu: '22.04', debian: '12' }
resources: { min_memory_mib: 1024, min_disk_mib: 10240, min_cores: 1 }
network_models: [bridged, routed, nat]
install_modes: [order, post]
billing: free
license: none
outputs:
    - key: docker_version
      type: text
      label: { en: Docker version, tr: Docker sürümü }
lifecycle:
    install: { script: install.sh, timeout_minutes: 15 }
    uninstall: { script: uninstall.sh, timeout_minutes: 10 }
    upgrade: { script: upgrade.sh, timeout_minutes: 10, from: '>=1.1.0 <1.3.0' }
