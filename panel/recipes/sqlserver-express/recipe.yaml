format: 2
slug: sqlserver-express
name: SQL Server Express
version: 1.0.0
category: web
description:
    en: Microsoft SQL Server 2022 Express with SQL logins, the sa administrator and a fixed TCP port.
    tr: SQL oturum açma, sa yöneticisi ve sabit TCP portu ile Microsoft SQL Server 2022 Express.
maintainers: [{ name: Proxmotion }]
homepage: https://www.microsoft.com/sql-server/sql-server-downloads
requires:
    platform: windows
resources: { min_memory_mib: 2048, min_disk_mib: 40960, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: port
      type: port
      default: 1433
      label: { en: TCP port, tr: TCP portu }
outputs:
    - key: server
      type: text
      label: { en: Server, tr: Sunucu }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: '{{ inputs.port }}', proto: tcp }
includes: [lib.ps1]
lifecycle:
    install: { script: install.ps1, timeout_minutes: 60 }
    uninstall: { script: uninstall.ps1, timeout_minutes: 30 }
actions:
    - key: reset_password
      label: { en: Reset the sa password, tr: sa parolasını sıfırla }
      script: actions/reset-password.ps1
      outputs:
          - key: username
            type: text
            label: { en: Username, tr: Kullanıcı adı }
          - key: password
            type: text
            secret: true
            label: { en: Password, tr: Parola }
      timeout_minutes: 5
