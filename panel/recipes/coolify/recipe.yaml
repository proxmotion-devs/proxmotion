format: 2
slug: coolify
name: Coolify
version: 1.0.0
category: container
description:
    en: Coolify, a self-hostable platform to deploy applications, databases and services from Git or Docker images, with automatic HTTPS.
    tr: Uygulamaları, veritabanlarını ve servisleri Git'ten ya da Docker imajlarından otomatik HTTPS ile dağıtmak için kendi sunucunuzda barındırılabilen bir platform olan Coolify.
maintainers: [{ name: Proxmotion }]
homepage: https://coolify.io/
requires:
    platform: linux
    os: [debian]
    min_versions: { ubuntu: '22.04', debian: '12' }
resources: { min_memory_mib: 2048, min_disk_mib: 30720, min_cores: 2 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: email
      type: email
      required: true
      label: { en: Administrator email, tr: Yönetici e-postası }
    - key: username
      type: slug
      default: admin
      max_length: 32
      label: { en: Administrator name, tr: Yönetici adı }
outputs:
    - key: panel_url
      type: url
      label: { en: Coolify address, tr: Coolify adresi }
    - key: email
      type: text
      label: { en: Login email, tr: Giriş e-postası }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: 8000, proto: tcp }
    - { port: 6001, proto: tcp }
    - { port: 6002, proto: tcp }
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 30 }
