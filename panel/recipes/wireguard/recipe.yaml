format: 2
slug: wireguard
name: WireGuard
version: 1.3.0
category: vpn
description:
    en: A WireGuard VPN server with one client configuration; all client traffic goes through the server.
    tr: Tek istemci yapılandırmasıyla WireGuard VPN sunucusu; istemcinin tüm trafiği sunucu üzerinden geçer.
maintainers: [{ name: Proxmotion }]
requires:
    platform: linux
    os: [debian]
    min_versions: { ubuntu: '22.04', debian: '12' }
resources: { min_memory_mib: 512, min_disk_mib: 5120, min_cores: 1 }
network_models: [bridged, routed, nat]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: port
      type: port
      default: 51820
      label: { en: UDP port, tr: UDP portu }
outputs:
    - key: client_config
      type: file
      filename: client.conf
      secret: true
      label: { en: Client configuration, tr: İstemci yapılandırması }
    - key: endpoint
      type: text
      label: { en: Server endpoint, tr: Sunucu adresi }
firewall:
    - { port: '{{ inputs.port }}', proto: udp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 10 }
    uninstall: { script: uninstall.sh, timeout_minutes: 5 }
    upgrade: { script: upgrade.sh, timeout_minutes: 10, from: '>=1.1.0 <1.3.0' }
actions:
    - key: add_client
      label: { en: Add a client, tr: İstemci ekle }
      script: actions/add-client.sh
      inputs:
          - key: name
            type: slug
            required: true
            max_length: 32
            label: { en: Client name, tr: İstemci adı }
      outputs:
          - key: client_config
            type: file
            filename: client.conf
            secret: true
            label: { en: Client configuration, tr: İstemci yapılandırması }
      timeout_minutes: 2
    - key: revoke_client
      label: { en: Remove a client, tr: İstemciyi kaldır }
      script: actions/revoke-client.sh
      inputs:
          - key: name
            type: slug
            required: true
            max_length: 32
            label: { en: Client name, tr: İstemci adı }
      timeout_minutes: 2
    - key: list_clients
      label: { en: List clients, tr: İstemcileri listele }
      script: actions/list-clients.sh
      outputs:
          - key: clients
            type: text
            label: { en: Clients, tr: İstemciler }
      timeout_minutes: 1
