format: 2
slug: plesk
name: Plesk
version: 1.0.0
category: control-panel
description:
    en: The Plesk Obsidian hosting control panel through Plesk's one-click installer. Needs a freshly installed server and a Plesk licence (a trial can be chosen on the first login).
    tr: Plesk'in tek tıkla kurucusuyla Plesk Obsidian hosting kontrol paneli. Yeni kurulmuş bir sunucu ve Plesk lisansı gerektirir (ilk girişte deneme lisansı seçilebilir).
maintainers: [{ name: Proxmotion }]
homepage: https://www.plesk.com/
requires:
    platform: linux
    os: [debian, almalinux, rocky]
    min_versions: { debian: '12', ubuntu: '22.04', almalinux: '8', rocky: '8' }
    max_versions: { rocky: '8' }
resources: { min_memory_mib: 2048, min_disk_mib: 20480, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: external
outputs:
    - key: panel_url
      type: url
      label: { en: Panel address, tr: Panel adresi }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: 8443, proto: tcp }
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 90 }
actions:
    - key: reset_password
      label:
          en: Reset the administrator password
          tr: Yönetici parolasını sıfırla
      script: actions/reset-password.sh
      outputs:
          - key: password
            type: text
            secret: true
            label: { en: Password, tr: Parola }
      timeout_minutes: 2
