format: 2
slug: portainer
name: Docker + Portainer
version: 1.0.0
category: container
description:
    en: Docker Engine with Portainer Community Edition, a web interface to manage containers, images, volumes and Compose stacks.
    tr: Docker Engine ve kapsayıcıları, imajları, birimleri ve Compose yığınlarını yönetmek için bir web arayüzü olan Portainer Community Edition.
maintainers: [{ name: Proxmotion }]
homepage: https://www.portainer.io/
requires:
    platform: linux
    os: [debian]
    min_versions: { ubuntu: '22.04', debian: '12' }
resources: { min_memory_mib: 1024, min_disk_mib: 10240, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: port
      type: port
      default: 9443
      label: { en: Portainer HTTPS port, tr: Portainer HTTPS portu }
outputs:
    - key: panel_url
      type: url
      label: { en: Portainer address, tr: Portainer adresi }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: '{{ inputs.port }}', proto: tcp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 20 }
    uninstall: { script: uninstall.sh, timeout_minutes: 5 }
actions:
    - key: reset_password
      label:
          en: Reset the administrator password
          tr: Yönetici parolasını sıfırla
      script: actions/reset-password.sh
      outputs:
          - key: username
            type: text
            label: { en: Username, tr: Kullanıcı adı }
          - key: password
            type: text
            secret: true
            label: { en: Password, tr: Parola }
      timeout_minutes: 5
