format: 2
slug: pterodactyl
name: Pterodactyl Panel
version: 1.0.3
category: control-panel
description:
    en: The Pterodactyl 2.0 game server panel (open beta) with nginx, PHP-FPM, MariaDB and Redis. Game servers run on nodes with Wings, installed separately.
    tr: nginx, PHP-FPM, MariaDB ve Redis ile Pterodactyl 2.0 oyun sunucusu paneli (açık beta). Oyun sunucuları ayrıca kurulan Wings ile node'larda çalışır.
maintainers: [{ name: Proxmotion }]
homepage: https://pterodactyl.io/
requires:
    platform: linux
    os: { families: [debian] }
    min_versions: { ubuntu: '24.04', debian: '12' }
resources: { min_memory_mib: 1024, min_disk_mib: 10240, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: email
      type: email
      required: true
      label: { en: Administrator email, tr: Yönetici e-postası }
    - key: username
      type: slug
      default: admin
      max_length: 32
      label: { en: Administrator username, tr: Yönetici kullanıcı adı }
    - key: domain
      type: domain
      required: false
      label: { en: Panel domain (optional), tr: Panel alan adı (isteğe bağlı) }
    - key: letsencrypt
      type: boolean
      default: false
      label:
          en: Get a Let's Encrypt certificate for the domain (accepts the Let's Encrypt terms)
          tr: Alan adı için Let's Encrypt sertifikası al (Let's Encrypt koşulları kabul edilir)
outputs:
    - key: panel_url
      type: url
      label: { en: Panel address, tr: Panel adresi }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
    - key: notice
      type: text
      label: { en: Notice, tr: Not }
firewall:
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
includes: [lib.sh]
lifecycle:
    install: { script: install.sh, timeout_minutes: 30 }
    uninstall: { script: uninstall.sh, timeout_minutes: 10 }
actions:
    - key: reset_password
      label:
          en: Reset the administrator password
          tr: Yönetici parolasını sıfırla
      script: actions/reset-password.sh
      outputs:
          - key: username
            type: text
            label: { en: Username, tr: Kullanıcı adı }
          - key: password
            type: text
            secret: true
            label: { en: Password, tr: Parola }
      timeout_minutes: 5
