format: 2
slug: fastpanel
name: FASTPANEL
version: 1.0.3
category: control-panel
description:
    en: The FASTPANEL hosting control panel with its web, database, FTP and mail services. Needs a freshly installed server.
    tr: Web, veritabanı, FTP ve e-posta servisleriyle FASTPANEL hosting kontrol paneli. Yeni kurulmuş bir sunucu gerektirir.
maintainers: [{ name: Proxmotion }]
homepage: https://fastpanel.direct/
requires:
    platform: linux
    os: [debian]
    min_versions: { ubuntu: '22.04', debian: '12' }
    max_versions: { ubuntu: '24.04', debian: '12' }
resources: { min_memory_mib: 2048, min_disk_mib: 20480, min_cores: 1 }
network_models: [bridged, routed]
install_modes: [order, post]
billing: free
license: none
inputs:
    - key: database
      type: enum
      options: [default, mariadb10.11, mariadb11.4, percona8.0]
      default: default
      label: { en: Database server, tr: Veritabanı sunucusu }
outputs:
    - key: panel_url
      type: url
      label: { en: Panel address, tr: Panel adresi }
    - key: username
      type: text
      label: { en: Username, tr: Kullanıcı adı }
    - key: password
      type: text
      secret: true
      label: { en: Password, tr: Parola }
firewall:
    - { port: 8888, proto: tcp }
    - { port: 80, proto: tcp }
    - { port: 443, proto: tcp }
lifecycle:
    install: { script: install.sh, timeout_minutes: 60 }
