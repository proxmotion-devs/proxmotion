name: Release

# A tag v<version> whose version is panel/VERSION publishes the production images to GHCR
# (docs/adr/0054): <version>, and for releases also <major>.<minor> and latest. The GitHub
# release gets the archive the native installer installs, its checksum and install.sh
# (docs/adr/0055).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tag matches panel/VERSION
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < panel/VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG does not match panel/VERSION ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The archive the native installer installs (docs/adr/0055), its checksum and the
  # installer, attached to the GitHub release.
  archive:
    name: Release archive
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/production/Dockerfile
          target: release
          build-args: VERSION=${{ needs.version.outputs.version }}
          outputs: type=local,dest=dist/proxmotion-${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=proxmotion

      - name: Pack
        working-directory: dist
        run: |
          tar --owner=0 --group=0 -czf "proxmotion-$VERSION.tar.gz" "proxmotion-$VERSION"
          sha256sum "proxmotion-$VERSION.tar.gz" > "proxmotion-$VERSION.tar.gz.sha256"
          cp "proxmotion-$VERSION/installer/install.sh" install.sh

      - name: GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "Proxmotion $VERSION" --generate-notes "${prerelease[@]}" \
            "proxmotion-$VERSION.tar.gz" "proxmotion-$VERSION.tar.gz.sha256" install.sh

  images:
    name: Image ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: proxmotion
            context: .
            file: deploy/docker/production/Dockerfile
            target: panel
          - image: proxmotion-nginx
            context: .
            file: deploy/docker/production/Dockerfile
            target: nginx
          - image: proxmotion-console-proxy
            context: deploy/console-proxy
            file: deploy/console-proxy/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
