name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    name: Panel (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      # Report every PHP version even when one of them fails.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The base branch too, for apps:check-versions.
          fetch-depth: 0

      # PHP is needed by the frontend too: the Wayfinder Vite plugin runs `php artisan`.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, bcmath, zip, pcntl, redis
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Build frontend
        run: npm run build

      # Formatting, lint, type checks, frontend tests, Pint, PHPStan and Pest.
      - name: Checks
        run: composer ci:check

      # App Marketplace recipes against their JSON Schema (ADR 0015, 0016).
      - name: Validate recipes
        run: php artisan apps:validate

      # A changed recipe needs a higher version: apps:sync refuses to replace a
      # version that is installed (ADR 0016 §2). Compared with the PR's base branch.
      - name: Recipe versions
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: php artisan apps:check-versions --base="origin/${BASE_REF}"

  console-proxy:
    name: Console proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/console-proxy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/console-proxy/package-lock.json

      - run: npm ci
      - run: npm test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then shellcheck $files; else echo "No shell scripts yet"; fi
