version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/panel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  - package-ecosystem: "npm"
    directory: "/panel"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript API, which
      # @vue/compiler-sfc needs to resolve imported prop types: the build fails.
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "npm"
    directory: "/deploy/console-proxy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  - package-ecosystem: "docker"
    directories:
      - "/deploy/docker"
      - "/deploy/console-proxy"
      - "/deploy/proxmox"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5

  - package-ecosystem: "docker-compose"
    directory: "/deploy/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
